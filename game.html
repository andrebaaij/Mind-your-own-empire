<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/src/assets/icons/electricity.png" />
    <title>Mind your own Empire</title>
    <script type="module" src="/src/game/main.ts"></script>
  </head>
  <body>
    <main id="game">
      <header class="hud">
        <span class="hud-label">Resources</span>
        <span class="hud-stat" title="Iron / storage">
          <img src="/src/assets/icons/iron.png" alt="Iron" />
          <span id="iron"></span>/<span id="iron-storage"></span>
        </span>
        <span class="hud-stat" title="Net energy per hour, storage">
          <img src="/src/assets/icons/electricity.png" alt="Energy" />
          <span id="energy"></span>/hr
          <span class="hud-muted">(storage <span id="energy-storage"></span>)</span>
        </span>
        <span class="hud-divider" aria-hidden="true">|</span>
        <span class="hud-label">Build:</span>
        <button type="button" class="hud-button" data-build="solar" aria-pressed="false">Solar</button>
        <button type="button" class="hud-button" data-build="block" aria-pressed="false">Block</button>
        <span class="hud-hint">Q/E rotate · wheel zoom · P pause · Esc cancel</span>
      </header>

      <output id="message" class="message" hidden></output>

      <dialog id="pause" class="pause">
        <h1>Paused</h1>
        <button type="button" id="pause-continue" class="button" autofocus>Continue</button>
        <button type="button" id="pause-fullscreen" class="button">Fullscreen on/off</button>
      </dialog>
    </main>
  </body>
</html>
